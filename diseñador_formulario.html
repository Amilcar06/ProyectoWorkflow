<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diseñador de Formularios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/formBuilder/3.6.1/form-builder.min.css" />
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #form-builder { margin-bottom: 20px; }
    </style>
</head>
<body>
<h2>Diseñador de Formularios</h2>
<div id="form-builder"></div>
<button id="guardar">Guardar Formulario</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/formBuilder/3.6.1/form-builder.min.js"></script>
<script>
    const formBuilder = $('#form-builder').formBuilder();

    $('#guardar').click(function () {
        const datos = formBuilder.actions.getData('json');
        $.post('guardar_formulario.php', { form: datos }, function (respuesta) {
            alert(respuesta);
        });
    });
</script>
</body>
</html>
